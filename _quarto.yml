            href: modulos/probabilidade.qmd
          - text: "Modelos Lineares e Regressão"
            href: modulos/regressao.qmd
          - text: "Modelos Generalizados (MLG)"
            href: modulos/mlg.qmd
          - text: "Séries Temporais"
            href: modulos/series_temporais.qmd
          - text: "Análise Multivariada"
            href: modulos/multivariada.qmd
          - text: "Delineamentos Experimentais"
            href: modulos/experimentos.qmd
          - text: "Machine Learning e Sobrevivência"
            href: modulos/aprendizado_maquina.qmd

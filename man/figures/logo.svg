<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Deep Space Navy to Vibrant Indigo) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="45%" stop-color="#0f172a"/>
      <stop offset="80%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Curve Glow Gradient -->
    <linearGradient id="curveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Curve Fill Area Gradient -->
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#2563eb" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Bars Gradient -->
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.08"/>
    </linearGradient>

    <!-- Outer Rim Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Apple Squircle Outer Container with Shadow -->
  <rect x="25" y="25" width="450" height="450" rx="100" ry="100" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2.5"/>

  <!-- Blueprint Subtle Grid (Apple Design Style) -->
  <g stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" stroke-dasharray="3,3">
    <line x1="80" y1="180" x2="420" y2="180"/>
    <line x1="80" y1="240" x2="420" y2="240"/>
    <line x1="80" y1="300" x2="420" y2="300"/>
    <line x1="150" y1="120" x2="150" y2="340"/>
    <line x1="250" y1="120" x2="250" y2="340"/>
    <line x1="350" y1="120" x2="350" y2="340"/>
  </g>

  <!-- Dynamic Histogram Bars (Background of Bell Curve) -->
  <g fill="url(#barGrad)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5">
    <rect x="110" y="280" width="36" height="45" rx="4"/>
    <rect x="156" y="235" width="36" height="90" rx="4"/>
    <rect x="202" y="185" width="36" height="140" rx="4"/>
    <rect x="248" y="160" width="36" height="165" rx="4"/>
    <rect x="294" y="200" width="36" height="125" rx="4"/>
    <rect x="340" y="260" width="36" height="65" rx="4"/>
  </g>

  <!-- Gaussian Curve Area Fill -->
  <path d="M 80 325 
           C 140 325, 175 320, 210 230 
           C 230 180, 240 145, 250 145 
           C 260 145, 270 180, 290 230 
           C 325 320, 360 325, 420 325 
           Z" fill="url(#areaGrad)"/>

  <!-- Gaussian Curve Stroke with Multi-Layer Glow -->
  <path d="M 80 325 
           C 140 325, 175 320, 210 230 
           C 230 180, 240 145, 250 145 
           C 260 145, 270 180, 290 230 
           C 325 320, 360 325, 420 325" 
        fill="none" stroke="#38bdf8" stroke-width="12" opacity="0.25" filter="url(#glow)"/>

  <path d="M 80 325 
           C 140 325, 175 320, 210 230 
           C 230 180, 240 145, 250 145 
           C 260 145, 270 180, 290 230 
           C 325 320, 360 325, 420 325" 
        fill="none" stroke="url(#curveGrad)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Peak Indicator Point (Pulse Effect) -->
  <circle cx="250" cy="145" r="9" fill="rgba(56, 189, 248, 0.3)" filter="url(#softGlow)"/>
  <circle cx="250" cy="145" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>

  <!-- Baseline Axis -->
  <line x1="75" y1="325" x2="425" y2="325" stroke="rgba(255, 255, 255, 0.3)" stroke-width="2" stroke-linecap="round"/>

  <!-- Brand Typography "estatR" -->
  <text x="250" y="405" 
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, sans-serif" 
        font-size="52" 
        font-weight="800" 
        letter-spacing="-1.2" 
        text-anchor="middle" 
        fill="#ffffff">
    estat<tspan fill="#38bdf8">R</tspan>
  </text>
  
  <!-- Subtle Badge Subtitle -->
  <text x="250" y="430" 
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif" 
        font-size="12" 
        font-weight="600" 
        letter-spacing="3" 
        text-anchor="middle" 
        fill="rgba(255, 255, 255, 0.45)">
    ESTATÍSTICA EM R
  </text>
</svg>

    <line x1="80" y1="180" x2="420" y2="180"></line>
    <line x1="80" y1="240" x2="420" y2="240"></line>
    <line x1="80" y1="300" x2="420" y2="300"></line>
    <line x1="150" y1="120" x2="150" y2="340"></line>
    <line x1="250" y1="120" x2="250" y2="340"></line>
    <line x1="350" y1="120" x2="350" y2="340"></line>
  </g><g fill="url(#barGrad)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5">
    <rect x="110" y="280" width="36" height="45" rx="4"></rect>
    <rect x="156" y="235" width="36" height="90" rx="4"></rect>
    <rect x="202" y="185" width="36" height="140" rx="4"></rect>
    <rect x="248" y="160" width="36" height="165" rx="4"></rect>
    <rect x="294" y="200" width="36" height="125" rx="4"></rect>
    <rect x="340" y="260" width="36" height="65" rx="4"></rect>
  </g><path d="M 80 325 
           C 140 325, 175 320, 210 230 

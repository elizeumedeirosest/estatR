           C 140 325, 175 320, 210 230 
           C 230 180, 240 145, 250 145 
           C 260 145, 270 180, 290 230 
           C 325 320, 360 325, 420 325" fill="none" stroke="url(#curveGrad)" stroke-width="4.5" stroke-linecap="round"></path><circle cx="250" cy="145" r="9" fill="rgba(56, 189, 248, 0.3)" filter="url(#softGlow)"></circle><circle cx="250" cy="145" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="2"></circle><line x1="75" y1="325" x2="425" y2="325" stroke="rgba(255, 255, 255, 0.3)" stroke-width="2" stroke-linecap="round"></line><text x="250" y="405" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.2" text-anchor="middle" fill="#ffffff">
    estat<tspan fill="#38bdf8">R</tspan>

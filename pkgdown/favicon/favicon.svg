<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description><dc:creator>RealFaviconGenerator</dc:creator><dc:source>https://realfavicongenerator.net</dc:source></rdf:Description></rdf:RDF></metadata><defs>
    <!-- Background Gradient (Deep Space Navy to Vibrant Indigo) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"></stop>
      <stop offset="45%" stop-color="#0f172a"></stop>
      <stop offset="80%" stop-color="#1e3a8a"></stop>
      <stop offset="100%" stop-color="#2563eb"></stop>
    </linearGradient>

    <!-- Curve Glow Gradient -->
    <linearGradient id="curveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"></stop>
      <stop offset="30%" stop-color="#38bdf8"></stop>
      <stop offset="50%" stop-color="#ffffff"></stop>
      <stop offset="70%" stop-color="#818cf8"></stop>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2"></stop>
    </linearGradient>

    <!-- Curve Fill Area Gradient -->
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"></stop>
      <stop offset="60%" stop-color="#2563eb" stop-opacity="0.12"></stop>
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0.0"></stop>
    </linearGradient>

    <!-- Bars Gradient -->
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"></stop>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.08"></stop>
    </linearGradient>

    <!-- Outer Rim Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"></feGaussianBlur>
      <feComposite in="SourceGraphic" in2="blur" operator="over"></feComposite>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"></feGaussianBlur>
      <feComposite in="SourceGraphic" in2="blur" operator="over"></feComposite>
    </filter>
